# Tunable settings. Change here, upload as a zip, no code edits needed.
timezone: America/New_York

timing:                       # minutes before scheduled start
  team: {due_minutes: 30, late_after_minutes: 10}   # posts at the first tick at or under T-30; LATE once under T-10
  mma:  {due_minutes: 95, late_after_minutes: 60}   # target T-90 before the first bout of the card

thresholds:
  play_min_edge: 0.025        # model win% minus no-vig market win%
  play_min_coverage: 0.85     # share of critical inputs actually available (so injuries must be present)
  edge_error_cap: 0.10        # an edge this large is treated as a data or model error -> PASS
  top_min_edge: 0.04
  top_min_coverage: 0.95
  top_per_day: 5              # designated at publish time so a locked pick never changes
  max_units: 3

model:
  anchor_shrink: 0.25         # the model may close this share of the gap between its rating and the no-vig market
  min_rated_games: 8          # stored games needed per team before a rating is trusted
  min_history: {nfl: 100, nba: 150, nhl: 150}   # below this many stored finals the tick keeps loading history by itself
  logit_weights:              # small schedule nudges added to the rating, in logit points (unvalidated)
    rest_day_diff: 0.02
    back_to_back: 0.05
  elo:                        # K = how fast ratings move, home = home-advantage in rating points
    nba: {k: 20, home: 70}
    nhl: {k: 8, home: 35}
    nfl: {k: 20, home: 48}
    mlb: {k: 6, home: 25}

coverage_weights:             # share of the coverage score each input provides
  market: 0.35
  ratings: 0.25
  schedule_rest: 0.10
  recent_form: 0.10
  injuries: 0.20

sports:
  nfl:  {kind: team, espn: [football, nfl]}
  nba:  {kind: team, espn: [basketball, nba]}
  nhl:  {kind: team, espn: [hockey, nhl]}
  mlb:  {kind: team, espn: [baseball, mlb]}
  ufc:  {kind: bout, espn: [mma, ufc]}
  dwcs: {kind: bout, via: ufc}            # no feed of its own: Contender Series events are picked out of the UFC feed by name

llm:                          # free tiers only, tried in this order. Groq is not used.
  gemini:     {model: gemini-flash-latest, daily_cap: 200}   # an alias Google keeps pointed at the current Flash model
  mistral:    {model: mistral-small-latest, daily_cap: 300}
  cloudflare: {model: "@cf/meta/llama-3.1-8b-instruct", daily_cap: 100}
  openrouter: {model: "openrouter/free", daily_cap: 40}
